name: omiai workflow

on:
  schedule:
    - cron: "00 16 * * *"    #runs everyday
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: checkout main repo
        uses: actions/checkout@v6.0.2
      - name: checkout utils repo
        uses: actions/checkout@v6.0.2
        with:
          repository: sparkarkii/utils
          path: utils
      - name: setup python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: 3.14
      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests bs4 jinja2 html5lib
      - name: execute script
        env:
            EMAIL: ${{ secrets.EMAIL }}
            PW: ${{ secrets.PW }}
        run: |
          python omiai.py
